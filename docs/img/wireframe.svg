<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="680" fill="#ffffff"/>
  <style>
    .box{fill:#f4f5f7;stroke:#8a94a3;stroke-width:1.5}
    .t{font-size:13px;fill:#2b3440;font-weight:600}
    .s{font-size:11px;fill:#5b6878}
    .n{font-size:11px;fill:#2453C4;font-weight:600}
  </style>
  <text x="20" y="32" font-size="18" font-weight="700" fill="#18212c">Wireframe · Page 1: Overview</text>
  <text x="20" y="52" class="s">Low-fidelity layout agreed with stakeholders before building. Numbers in blue link each area to the question log.</text>

  <rect class="box" x="20" y="66" width="920" height="40" rx="4"/>
  <text x="34" y="91" class="t">Filters: Date range · Category · Location · Supplier</text>

  <rect class="box" x="20" y="118" width="220" height="90" rx="4"/>
  <text x="34" y="142" class="t">OTIF %</text><text x="34" y="162" class="s">Big number + target pill</text><text x="34" y="180" class="s">▲▼ vs previous period</text><text x="200" y="142" class="n">Q-01</text>
  <rect class="box" x="253" y="118" width="220" height="90" rx="4"/>
  <text x="267" y="142" class="t">Stockout rate %</text><text x="267" y="162" class="s">Big number + target pill</text><text x="267" y="180" class="s">Lost sales units</text><text x="433" y="142" class="n">Q-05</text>
  <rect class="box" x="486" y="118" width="220" height="90" rx="4"/>
  <text x="500" y="142" class="t">Days of cover by class</text><text x="500" y="162" class="s">A · B · C vs cover band</text><text x="500" y="180" class="s">Red below band, amber above</text><text x="666" y="142" class="n">Q-08</text>
  <rect class="box" x="719" y="118" width="221" height="90" rx="4"/>
  <text x="733" y="142" class="t">Excess stock value £</text><text x="733" y="162" class="s">At end of selected period</text><text x="733" y="180" class="s">Count of SKU-locations</text><text x="900" y="142" class="n">Q-07</text>

  <rect class="box" x="20" y="220" width="500" height="230" rx="4"/>
  <text x="34" y="244" class="t">Supplier scorecard (table)</text>
  <text x="34" y="264" class="s">Supplier · PO lines · Spend · On time · In full · OTIF · LT variance · Stockout</text>
  <text x="34" y="282" class="s">Conditional formatting: red &lt; 85% OTIF or variance &gt; 2 days</text>
  <g fill="#e1e5ea"><rect x="34" y="296" width="472" height="18"/><rect x="34" y="320" width="472" height="18"/><rect x="34" y="344" width="472" height="18"/><rect x="34" y="368" width="472" height="18"/><rect x="34" y="392" width="472" height="18"/></g>
  <text x="34" y="436" class="s">Click a row → drill-through to PO lines (Q-06)</text>
  <text x="470" y="244" class="n">Q-01–03</text>

  <rect class="box" x="533" y="220" width="407" height="230" rx="4"/>
  <text x="547" y="244" class="t">OTIF vs stockout rate by month</text>
  <text x="547" y="264" class="s">Dual-axis line chart, 12 months</text>
  <polyline points="560,330 610,345 660,335 710,350 760,340 810,355 860,345 910,350" fill="none" stroke="#8a94a3" stroke-width="2"/>
  <polyline points="560,420 610,395 660,400 710,390 760,402 810,410 860,415 910,380" fill="none" stroke="#8a94a3" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="905" y="244" class="n">Q-05</text>

  <rect class="box" x="20" y="462" width="920" height="200" rx="4"/>
  <text x="34" y="486" class="t">At-risk SKUs (horizontal bar)</text>
  <text x="34" y="506" class="s">Projected cover (bar) vs supplier promised lead time (marker), sorted worst first · colour = supplier status · click → supplier drill-through</text>
  <g fill="#e1e5ea"><rect x="140" y="522" width="420" height="16"/><rect x="140" y="546" width="470" height="16"/><rect x="140" y="570" width="520" height="16"/><rect x="140" y="594" width="560" height="16"/><rect x="140" y="618" width="600" height="16"/></g>
  <g stroke="#2b3440" stroke-width="3"><line x1="640" y1="522" x2="640" y2="538"/><line x1="640" y1="546" x2="640" y2="562"/><line x1="740" y1="570" x2="740" y2="586"/><line x1="740" y1="594" x2="740" y2="610"/><line x1="800" y1="618" x2="800" y2="634"/></g>
  <text x="890" y="486" class="n">Q-04</text>
</svg>
